name: deenmate_sdp2
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.7.0
  google_sign_in: ^6.3.0
  firebase_ui_auth: ^1.17.0
  cloud_firestore: ^5.6.5
  firebase_messaging: ^15.2.10

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10

  # Location
  geolocator: ^13.0.2
  geocoding: ^5.0.0
  google_maps_flutter: ^2.9.0

  # Prayer Times
  adhan: ^2.0.0+1
  timezone: ^0.9.4

  # ✅ FIXED: Use 0.20.2 (not 0.20.3)
  intl: ^0.20.2

  # Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^10.3.1

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Networking
  http: ^1.6.0

  # Utilities
  url_launcher: ^6.3.1
  local_auth: ^3.0.2
  pdf: ^3.12.0
  printing: ^5.14.3
  video_player: ^2.9.2
  sensors_plus: ^6.1.0
  image_picker: ^1.1.2
  image_cropper: ^12.2.1
  mobile_scanner: ^5.0.0
  permission_handler: ^11.3.1
  google_mlkit_text_recognition: ^0.11.0
  file_picker: ^8.1.4
  open_filex: ^4.5.0
  path_provider: ^2.1.4
  firebase_ai: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/header_art.svg
    - assets/images/islamic_events/islamic_new_year/
    - assets/images/islamic_events/ashura/
    - assets/images/islamic_events/mawlid/
    - assets/images/islamic_events/isra_miraj/
    - assets/images/islamic_events/shab_e_barat/
    - assets/images/islamic_events/ramadan_start/
    - assets/images/islamic_events/laylat_al_qadr/
    - assets/images/islamic_events/eid_al_fitr/
    - assets/images/islamic_events/eid_al_adha/
    - assets/images/islamic_events/arafah/
    - assets/images/inheritance/
    - assets/images/hajj_umrah/
    - assets/images/health_tips/
    - assets/images/salat/wudu/
    - assets/images/salat/salat_steps/
    - assets/videos/
